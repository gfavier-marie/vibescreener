# Installeurs : .dmg (macOS) et .exe (Windows). whisper-server est embarqué ;
# le modèle (547 Mo) est téléchargé au premier lancement.
appId: fr.pastille.desktop
productName: VibeScreener
extraMetadata:
  name: vibescreener # dossier d'installation Windows : %LOCALAPPDATA%\Programs\vibescreener (sinon « @pastilledesktop »)
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - resources/**
  - fixtures/**
  - package.json
  # Documents : seules les parties lues par le processus principal (pdf.js pour Node, pdf-lib en CommonJS).
  - '!**/node_modules/pdfjs-dist/{build,web,types,image_decoders}/**'
  - '!**/node_modules/pdfjs-dist/legacy/{web,image_decoders}/**'
  - '!**/node_modules/pdf-lib/{dist,es,src,ts3.4}/**'
  - '!**/node_modules/{pdfjs-dist,pdf-lib}/**/*.map'
extraResources:
  - from: ../../vendor/whisper
    to: whisper
asarUnpack:
  - '**/*.node'
  - '**/node_modules/get-windows/main'
npmRebuild: false
# Projet partagé : un double-clic sur un fichier .vibescreener l'importe (open-file sur macOS, argument sous Windows).
fileAssociations:
  - ext: vibescreener
    name: VibeScreener Project
    role: Editor
mac:
  target:
    - target: dmg
      arch: [arm64]
  category: public.app-category.developer-tools
  # Pas de compte Apple Developer : signature ad hoc (sans elle, macOS dit « endommagé »
  # pour une app téléchargée). install.sh évite l'alerte Gatekeeper.
  identity: '-'
  hardenedRuntime: false
  artifactName: ${productName}-${arch}.${ext} # lien stable : dl.vibescreener.dev/VibeScreener-arm64.dmg
  # Demande d'accès au micro : anglais par défaut, traduite dans build/lproj (macOS prend la langue du système).
  extendInfo:
    NSMicrophoneUsageDescription: VibeScreener uses the microphone to dictate your comments.
    # Pas d'icône dans le Dock au lancement : elle n'apparaît que tant qu'une fenêtre est ouverte (dock.ts).
    LSUIElement: true
  extraResources:
    - from: build/lproj
      to: .
win:
  target: nsis
  # Pas de certificat de signature : un .exe téléchargé par le navigateur déclenche SmartScreen
  # (« Informations complémentaires » > « Exécuter quand même ») ; install.ps1 l'évite.
  artifactName: ${productName}-Setup.${ext} # lien stable : dl.vibescreener.dev/VibeScreener-Setup.exe
nsis:
  oneClick: true # installation pour l'utilisateur, sans droits administrateur
