<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' pastille: blob: data:; style-src 'self' 'unsafe-inline'" />
    <title>VibeScreener</title>
    <link rel="stylesheet" href="./theme.css" />
    <style>
      /* L'éditeur est toujours sombre : la capture claire ressort, les pastilles aussi.
         (html:root l'emporte sur theme.css, que Vite insère après ce bloc.) */
      html:root {
        color-scheme: dark;
        --bg: #161618; --header: #1c1c1f; --stage: #0e0e10; --card: #232327; --chip: #26262a;
        --border: #2a2a2e; --border-2: #2e2e33; --border-3: #3a3a40;
        --text: #f2f2f3; --text-2: #d1d1d6; --muted: #a1a1a8; --faint: #8e8e96;
        --accent-text: #ff8a66; --accent-hover: #ffb199;
      }
      html, body, #root { height: 100%; background: var(--bg); color: var(--text); }
      /* Couleurs des quatre modes sur fond sombre, celles du site. */
      .mode-capture { --mc: #ff6a3d; --mcs: rgba(255, 106, 61, 0.16); }
      .mode-video { --mc: #b49cff; --mcs: rgba(180, 156, 255, 0.16); }
      .mode-documents { --mc: #6aa8ff; --mcs: rgba(106, 168, 255, 0.16); }
      .mode-tour { --mc: #3dd9a4; --mcs: rgba(61, 217, 164, 0.16); }
      textarea::placeholder, input::placeholder { color: var(--faint); }
      .editor { display: grid; grid-template-rows: auto 1fr auto; height: 100%; }

      /* En-tête : sert aussi de barre de titre (macOS : feux tricolores à gauche). */
      header {
        min-height: 52px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 12px; padding: 8px 14px 8px 16px;
        background: var(--header); border-bottom: 1px solid var(--border); -webkit-app-region: drag;
      }
      .mac header { padding-left: 84px; }
      header button, header input, header .chip { -webkit-app-region: no-drag; }
      .crumb { height: 30px; padding: 0 8px; border: 0; border-radius: 7px; background: transparent; color: var(--muted); font-size: 13.5px; }
      .crumb:hover { background: var(--chip); color: var(--text); }
      .crumb-sep { margin: 0 -8px; color: var(--faint); }
      .name { display: flex; align-items: center; gap: 7px; height: 30px; padding: 0 8px; border: 0; border-radius: 7px; background: transparent; cursor: text; }
      .name:hover { background: var(--chip); }
      .name span { font-size: 13.5px; font-weight: 600; letter-spacing: -0.01em; }
      .name svg { color: var(--faint); }
      .name-input { height: 30px; width: 280px; padding: 0 8px; border: 1px solid var(--accent); border-radius: 7px; background: var(--stage); font-size: 13.5px; font-weight: 600; outline: none; }
      .count { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
      .spacer { flex: 1; }
      header .chip { height: 28px; padding: 0 10px; background: var(--chip); border: 0; color: var(--text-2); font-size: 12px; }
      header .chip .dot { background: #30d158; }
      .export { position: relative; -webkit-app-region: no-drag; }
      .export .btn.primary { height: 32px; padding: 0 12px; border-radius: 8px; gap: 8px; box-shadow: inset 0 -1px 0 rgba(0, 0, 0, 0.18); }
      .export kbd { font-weight: 500; opacity: 0.85; }
      .export .menu, .app-menu .menu {
        position: absolute; right: 0; top: calc(100% + 6px); z-index: 10; display: grid; min-width: 250px; padding: 5px;
        background: var(--card); border: 1px solid var(--border-3); border-radius: 10px; box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
      }
      .export .menu button { display: flex; justify-content: space-between; gap: 16px; height: 30px; padding: 0 10px; border: 0; border-radius: 6px; background: none; text-align: left; }
      .export .menu button:hover { background: var(--chip); }
      .export .menu kbd { color: var(--faint); }

      /* Menu ≡ : les entrées du menu de l'icône (menu/items.tsx), en sombre. Tout est préfixé
         .app-menu, sinon .item (liste des points) s'y appliquerait. */
      .app-menu { position: relative; -webkit-app-region: no-drag; }
      .app-menu .menu-btn {
        width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; padding: 0;
        border: 0; border-radius: 8px; background: var(--chip); color: var(--text-2);
      }
      .app-menu .menu-btn:hover, .app-menu .menu-btn[aria-expanded='true'] { background: var(--border-3); color: var(--text); }
      .app-menu .menu-backdrop { position: fixed; inset: 0; z-index: 9; -webkit-app-region: no-drag; }
      .app-menu .menu { gap: 2px; min-width: 300px; max-height: calc(100vh - 70px); overflow-y: auto; color: var(--text); font-size: 13px; text-align: left; }
      .app-menu .mode { display: flex; align-items: center; gap: 10px; padding: 5px 10px 5px 6px; border: 0; border-radius: 7px; background: transparent; text-align: left; }
      .app-menu .mode:hover { background: var(--chip); }
      .app-menu .mode .txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
      .app-menu .mode b { font-weight: 600; }
      .app-menu .mode small { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .app-menu .mode kbd { font-size: 12px; color: var(--faint); }
      .app-menu .item {
        height: 30px; display: flex; align-items: center; gap: 10px; padding: 0 10px; border: 0; border-radius: 6px;
        background: transparent; text-align: left;
      }
      .app-menu .item:hover:not(:disabled) { background: var(--chip); }
      .app-menu .item svg { color: var(--muted); }
      .app-menu .item:disabled, .app-menu .item:disabled svg { color: #6b6b72; }
      .app-menu .item.update, .app-menu .item.update svg { color: var(--accent-text); font-weight: 600; }
      .app-menu .item span { flex: 1; }
      .app-menu .item kbd, .app-menu .recent .meta { font-size: 12px; color: var(--faint); }
      .app-menu hr { height: 1px; border: 0; margin: 5px 6px; background: var(--border-3); }
      .app-menu .section { font-size: 11px; font-weight: 600; color: var(--faint); padding: 6px 10px 4px; }
      .app-menu .recent { display: flex; align-items: center; gap: 8px; border-radius: 6px; }
      .app-menu .recent:hover { background: var(--chip); }
      .app-menu .recent .open { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; padding: 5px 0 5px 10px; border: 0; background: transparent; text-align: left; }
      .app-menu .recent .title { font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .app-menu .recent .meta { font-size: 11px; font-variant-numeric: tabular-nums; }
      .app-menu .recent .again { width: 28px; height: 28px; margin-right: 4px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 6px; background: transparent; color: var(--muted); }
      .app-menu .recent .again:hover { background: var(--card); color: var(--text); }
      .empty .app-menu { position: absolute; top: 10px; right: 14px; }

      main { display: grid; grid-template-columns: minmax(0, 1fr) 340px; min-height: 0; }

      /* Scène : la capture posée sur une carte, barre d'aide et zoom en bas. */
      .stage { position: relative; overflow: hidden; background: var(--stage); }
      .stage canvas { display: block; touch-action: none; }
      .stage-bar {
        position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); display: flex; align-items: center; gap: 12px;
        height: 36px; padding: 0 6px 0 14px; border-radius: 10px; background: var(--header); border: 1px solid var(--border-2);
        color: var(--muted); font-size: 12px; white-space: nowrap;
      }
      .stage-bar b { color: var(--text); font-weight: 400; }
      .stage-bar i { width: 1px; height: 16px; background: var(--border-2); }
      .stage-bar button { width: 26px; height: 26px; border: 0; border-radius: 6px; background: transparent; font-size: 14px; }
      .stage-bar button:hover, .stage-bar button[aria-pressed='true'] { background: var(--chip); }
      .stage-bar button svg { display: block; margin: auto; }
      .stage-bar .zoom { color: var(--text); font-variant-numeric: tabular-nums; min-width: 38px; text-align: center; }

      /* Bulle de commentaire du point sélectionné. */
      .bubble {
        position: absolute; z-index: 5; width: 312px; padding: 12px; display: flex; flex-direction: column; gap: 10px;
        border-radius: 12px; background: var(--card); border: 1px solid var(--border-3); box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
      }
      .bubble-head { display: flex; align-items: center; gap: 10px; min-height: 22px; font-size: 12px; }
      .bubble-head .num { display: flex; align-items: center; gap: 6px; font-weight: 600; }
      .rec-dot { width: 8px; height: 8px; border-radius: 999px; background: #ff453a; }
      .wave { flex: 1; height: 22px; display: flex; align-items: center; gap: 3px; }
      .wave span { width: 3px; border-radius: 2px; background: var(--text); transition: height 0.1s; }
      .wave.small { flex: none; height: 18px; gap: 2px; }
      .wave.small span { width: 2px; background: var(--text-2); }
      .time { font-family: var(--mono); font-size: 12px; color: var(--muted); }
      .bubble .field {
        width: 100%; min-height: 54px; resize: none; padding: 9px 10px; border-radius: 8px; border: 1px solid var(--accent);
        background: #1a1a1d; line-height: 1.4; outline: none; overflow: hidden; box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.04);
      }
      .bubble .meta { display: flex; align-items: center; gap: 8px; color: var(--faint); font-size: 11.5px; }
      .inspire {
        flex: none; display: flex; align-items: center; gap: 6px; height: 24px; padding: 0 9px;
        border: 1px solid var(--border-3); border-radius: 6px; background: transparent; color: var(--text-2); font-size: 12px;
      }
      .inspire:hover { background: var(--chip); color: var(--text); }
      .bubble .keys { display: flex; flex-wrap: wrap; gap: 4px 12px; padding-top: 8px; border-top: 1px solid var(--border-2); color: var(--faint); font-size: 11.5px; }
      .bubble .keys b { color: var(--text-2); font-weight: 400; }
      .status { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 11.5px; }
      .status.error { color: var(--accent-text); }
      .status .retry { height: 22px; padding: 0 8px; border: 1px solid var(--border-3); border-radius: 6px; background: transparent; color: var(--text); font-size: 11.5px; }

      /* Panneau de droite : onglets Points (de l'écran affiché) et Remarques générales. */
      aside { display: flex; flex-direction: column; min-height: 0; background: var(--header); border-left: 1px solid var(--border); }
      aside .segmented { flex: none; margin: 12px 12px 0; background: var(--stage); }
      aside .segmented button { flex: 1 1 auto; display: flex; align-items: center; justify-content: center; gap: 6px; height: 28px; padding: 0 10px; color: var(--muted); white-space: nowrap; }
      aside .segmented button:hover { color: var(--text); }
      aside .segmented button[aria-selected='true'] { background: var(--border-2); color: var(--text); font-weight: 500; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.4); }
      .tab-count {
        min-width: 18px; height: 17px; padding: 0 5px; border-radius: 999px; background: var(--border-3); color: var(--text-2);
        font-size: 11px; font-weight: 600; line-height: 17px; text-align: center; font-variant-numeric: tabular-nums;
      }
      .aside-head { display: flex; align-items: center; gap: 8px; padding: 14px 12px 12px 16px; border-bottom: 1px solid var(--border); }
      .aside-head .titles { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
      .aside-head .title { font-weight: 600; }
      .aside-head .sub { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .nav-btn { width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 7px; background: var(--chip); }
      .nav-btn:disabled { color: #6b6b72; }
      .points { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; padding: 10px; }
      .points .none { padding: 6px; color: var(--muted); }
      .item { position: relative; display: flex; gap: 10px; padding: 10px; border-radius: 10px; }
      .item:hover { background: rgba(255, 255, 255, 0.03); }
      .item.selected { background: var(--chip); box-shadow: inset 0 0 0 1.5px var(--accent); }
      .item .body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
      .item textarea { width: 100%; padding: 0; border: 0; background: transparent; line-height: 1.45; resize: none; outline: none; overflow: hidden; }
      .item .meta { display: flex; align-items: center; gap: 6px; color: var(--faint); font-size: 11.5px; }
      .item .delete {
        position: absolute; top: 6px; right: 6px; width: 22px; height: 22px; display: none; align-items: center; justify-content: center;
        border: 0; border-radius: 6px; background: var(--card); color: var(--muted);
      }
      .item:hover .delete { display: flex; }
      .item .mic { position: absolute; top: 6px; right: 32px; display: none; }
      .item:hover .mic, .item .mic.on { display: flex; }
      .mic {
        width: 22px; height: 22px; padding: 0; display: flex; align-items: center; justify-content: center; flex: none;
        border: 0; border-radius: 6px; background: var(--card); color: var(--muted);
      }
      .mic:hover { color: var(--text); }
      .mic.on { color: #ff453a; }
      .bubble-head .mic { background: var(--chip); }
      .skeleton { display: flex; flex-direction: column; gap: 6px; padding-top: 4px; }
      .skeleton i { height: 8px; border-radius: 4px; background: var(--border-2); }
      .badge {
        width: 22px; height: 22px; flex: none; border-radius: 999px; background: var(--accent); color: #fff;
        font-size: 10.5px; font-weight: 700; display: flex; align-items: center; justify-content: center; font-variant-numeric: tabular-nums;
      }
      .badge.point { border-radius: 11px 11px 11px 3px; }
      .badge.wide { font-size: 9px; }
      .sketches { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
      .sketch { position: relative; }
      .sketch > button:first-child { display: block; width: 76px; height: 50px; padding: 0; border: 1px solid var(--border-3); border-radius: 6px; background: #fff; overflow: hidden; cursor: zoom-in; }
      .sketch img { width: 100%; height: 100%; object-fit: contain; }
      .sketch .remove {
        position: absolute; top: -7px; right: -7px; width: 18px; height: 18px; padding: 0; display: none; align-items: center; justify-content: center;
        border: 0; border-radius: 999px; background: var(--muted); color: var(--bg);
      }
      .sketch:hover .remove { display: flex; }
      .sketches .count { color: var(--faint); font-size: 11.5px; }
      /* Remarques générales : une liste, chaque ligne tapée ou dictée. */
      .notes { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; padding: 12px 10px 10px; }
      .notes ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
      .remark { display: flex; gap: 8px; padding: 7px 6px; border-radius: 8px; }
      .remark:hover { background: rgba(255, 255, 255, 0.03); }
      .remark:focus-within, .remark.recording { background: var(--chip); }
      .remark .num { flex: none; min-width: 16px; color: var(--faint); line-height: 1.45; text-align: right; font-variant-numeric: tabular-nums; }
      .remark .body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
      .remark textarea { width: 100%; padding: 0; border: 0; background: transparent; line-height: 1.45; resize: none; outline: none; overflow: hidden; }
      .remark .tools { display: flex; gap: 2px; align-self: flex-start; visibility: hidden; }
      .remark:hover .tools, .remark:focus-within .tools, .remark.recording .tools { visibility: visible; }
      .remark .tools button { width: 22px; height: 22px; padding: 0; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 6px; background: var(--card); color: var(--muted); }
      .remark .tools button:hover { color: var(--text); }
      .remark .tools button.on { color: #ff453a; }
      .add-note {
        flex: none; display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 8px; border: 1px dashed var(--border-3); border-radius: 8px;
        background: transparent; color: var(--muted); text-align: left;
      }
      .add-note:hover { color: var(--text); border-color: var(--muted); }
      .add-note .hint { margin-left: auto; color: var(--faint); font-size: 11.5px; }
      .aside-foot { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--border); color: var(--faint); font-size: 12px; }

      /* Vignettes des écrans de la session. */
      nav { display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: var(--bg); border-top: 1px solid var(--border); overflow-x: auto; }
      nav[hidden] { display: none; }
      .shot { position: relative; flex: none; }
      .shot .remove {
        position: absolute; top: 5px; right: 5px; width: 20px; height: 20px; padding: 0; display: none; align-items: center; justify-content: center;
        border: 0; border-radius: 999px; background: rgba(0, 0, 0, 0.7); color: #fff;
      }
      .shot:hover .remove, .shot .remove:focus-visible { display: flex; }
      .thumb { flex: none; display: flex; flex-direction: column; gap: 6px; padding: 0; border: 0; background: transparent; text-align: left; }
      .thumb .img { display: block; width: 126px; height: 86px; border-radius: 6px; background: #fff; overflow: hidden; box-shadow: 0 0 0 1px var(--border-2); }
      .thumb img { width: 100%; height: 100%; object-fit: cover; object-position: top left; display: block; }
      .thumb[aria-current='true'] .img { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--accent); }
      .thumb .cap { font-size: 11.5px; color: var(--muted); }
      .thumb[aria-current='true'] .cap { color: var(--text); font-weight: 600; }
      /* Les quatre modes au bout des vignettes : de vrais boutons, qui ne ressemblent pas à une vignette. */
      .btn.new-capture { flex: none; height: 36px; padding: 0 12px 0 7px; border-radius: 9px; gap: 8px; border-color: var(--border-3); color: var(--text-2); }
      .btn.new-capture:hover { color: var(--text); border-color: var(--muted); }
      .new-capture .mode-tile { width: 24px; height: 24px; border-radius: 6px; }
      .new-capture kbd { font-weight: 500; color: var(--faint); }

      .empty { position: relative; height: 100%; display: grid; place-content: center; justify-items: center; gap: 14px; text-align: center; color: var(--muted); font-size: 14px; }
      /* Seul le haut déplace la fenêtre : une zone de déplacement ne reçoit pas les fichiers déposés (Windows). */
      .empty::before { content: ''; position: absolute; inset: 0 0 auto 0; height: 52px; -webkit-app-region: drag; }
      .empty h1 { color: var(--text); font-size: 20px; font-weight: 700; letter-spacing: -0.02em; }
      .empty > p { max-width: 520px; line-height: 1.5; }
      .empty .btn { height: 36px; padding: 0 14px; border-radius: 9px; background: transparent; border-color: var(--border-3); color: var(--text-2); -webkit-app-region: no-drag; }
      /* Les quatre modes en cartes, comme sur le site : couleur, raccourci, nom, phrase et mode d'emploi. */
      .mode-cards { display: grid; grid-template-columns: repeat(2, minmax(0, 270px)); gap: 12px; margin: 8px 0 6px; padding: 0 24px; }
      @media (min-width: 1180px) { .mode-cards { grid-template-columns: repeat(4, minmax(0, 250px)); } }
      .mode-card {
        display: flex; flex-direction: column; gap: 10px; padding: 14px 16px 16px; border: 1px solid var(--border-2); border-radius: 14px;
        background: var(--header); color: var(--text); text-align: left; -webkit-app-region: no-drag; transition: border-color 0.15s, background 0.15s;
      }
      .mode-card:hover { border-color: var(--mc); background: var(--card); }
      .mode-card .top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
      .mode-card .mode-tile { width: 38px; height: 38px; border-radius: 10px; }
      .mode-card kbd { padding: 2px 7px; border-radius: 6px; background: var(--chip); color: var(--text-2); font-size: 12px; }
      .mode-card .name { display: flex; align-items: baseline; gap: 8px; font-size: 16px; font-weight: 700; letter-spacing: -0.01em; }
      .mode-card .num { font: 500 12px var(--mono); color: var(--mc); }
      .mode-card .text { font-size: 12.5px; line-height: 1.5; color: var(--muted); }
      .mode-card .text b { color: var(--text-2); font-weight: 600; }
      .toast {
        position: fixed; left: 50%; bottom: 140px; transform: translateX(-50%); max-width: 70%; padding: 9px 14px; z-index: 30;
        border-radius: 10px; background: #f2f2f3; color: #1d1d1f; font-weight: 500; box-shadow: 0 10px 28px rgba(0, 0, 0, 0.4); word-break: break-all;
      }
      .toast.error { background: #ff453a; color: #fff; }
      /* Toutes les sessions : liste par-dessus l'éditeur. */
      .sessions-backdrop { position: fixed; inset: 0; z-index: 25; display: grid; place-items: center; background: rgba(0, 0, 0, 0.55); -webkit-app-region: no-drag; text-align: left; }
      .sessions {
        width: min(560px, 90vw); max-height: 72vh; display: flex; flex-direction: column; padding: 6px;
        background: var(--card); border: 1px solid var(--border-3); border-radius: 12px; box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
      }
      .sessions-head { display: flex; align-items: center; justify-content: space-between; padding: 8px 8px 10px 12px; }
      .sessions h2 { margin: 0; color: var(--text); font-size: 15px; font-weight: 600; }
      .sessions .none { padding: 4px 12px 14px; color: var(--muted); }
      .sessions ul { list-style: none; margin: 0; padding: 0; overflow-y: auto; }
      .sessions li { display: flex; align-items: center; gap: 4px; padding-right: 6px; border-radius: 8px; }
      .sessions li:hover { background: var(--chip); }
      .sessions .open { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; padding: 8px 10px; border: 0; background: transparent; text-align: left; }
      .sessions .title { color: var(--text); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .sessions .meta { color: var(--muted); font-size: 12px; }
      .sessions .tag { padding: 2px 8px; border-radius: 999px; background: var(--accent); color: #fff; font-size: 11px; font-weight: 600; }
      .sessions .tool { width: 28px; height: 28px; padding: 0; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 6px; background: transparent; color: var(--muted); visibility: hidden; }
      .sessions li:hover .tool, .sessions .tool:focus-visible { visibility: visible; }
      .sessions .tool:hover:not(:disabled) { background: var(--card); color: var(--text); }
      .sessions .tool:disabled { opacity: 0.4; }
      .zoomed { position: fixed; inset: 0; z-index: 20; background: rgba(0, 0, 0, 0.7); display: grid; place-items: center; cursor: zoom-out; }

    </style>
