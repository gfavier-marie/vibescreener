<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
    <title>VibeScreener</title>
    <link rel="stylesheet" href="./theme.css" />
    <style>
      html, body, #root { height: 100%; background: var(--panel); }
      .settings { display: flex; flex-direction: column; height: 100%; }
      .toolbar { flex: none; background: #ececef; border-bottom: 1px solid var(--border-2); -webkit-app-region: drag; }
      .toolbar .title { height: 40px; display: flex; align-items: center; justify-content: center; font-weight: 600; }
      .win .toolbar .title { display: none; }
      .win .toolbar { padding-top: 8px; }
      [role='tablist'] { display: flex; justify-content: center; gap: 4px; padding: 0 0 8px; }
      [role='tab'] {
        width: 92px; height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
        border: 0; border-radius: 8px; background: transparent; color: var(--text-2); font-size: 11.5px; -webkit-app-region: no-drag;
      }
      [role='tab']:hover { background: rgba(0, 0, 0, 0.05); }
      [role='tab'][aria-selected='true'] { background: #dcdce1; color: var(--text); }
      .content { flex: 1; overflow-y: auto; padding: 20px 32px 28px; display: flex; flex-direction: column; gap: 18px; }
      section { display: flex; flex-direction: column; gap: 6px; }
      section h2 { margin-left: 4px; font-size: 12px; font-weight: 600; color: var(--muted); }
      .group { background: var(--bg); border: 1px solid var(--border); border-radius: 10px; }
      .row { min-height: 46px; display: flex; align-items: center; gap: 12px; padding: 8px 12px 8px 14px; }
      .row + .row { border-top: 1px solid var(--divider); }
      .row > .label { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
      .row > .label small { font-size: 11.5px; color: var(--muted); }
      .row.stack { flex-direction: column; align-items: stretch; gap: 8px; padding: 12px 14px; }
      .hint { margin-left: 4px; font-size: 11.5px; color: var(--muted); }
      .error { margin-left: 4px; font-size: 12px; color: var(--accent-text); }
      .btn.shortcut { min-width: 92px; background: var(--panel); font-weight: 500; letter-spacing: 0.06em; }
      .btn.shortcut[aria-pressed='true'] { border-color: var(--accent); letter-spacing: 0; color: var(--muted); }
      .stepper { display: flex; align-items: center; border: 1px solid var(--border-2); border-radius: 7px; overflow: hidden; }
      .stepper button { width: 28px; height: 26px; border: 0; background: var(--panel); }
      .stepper button:disabled { color: var(--faint); }
      .stepper span { width: 40px; text-align: center; font-variant-numeric: tabular-nums; }
      .stepper.off span { color: var(--faint); }
      select, input[type='text'], input[type='password'], input:not([type]) {
        height: 28px; padding: 0 8px; border: 1px solid var(--border-2); border-radius: 7px; background: var(--bg);
      }
      textarea { width: 100%; padding: 8px 10px; border: 1px solid var(--border-2); border-radius: 8px; background: var(--bg); line-height: 1.45; resize: vertical; }
      .path { display: flex; align-items: center; gap: 6px; color: var(--text-2); max-width: 300px; }
      .path span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .path svg { color: var(--muted); flex: none; }
      .field { display: flex; gap: 8px; }
      .field input { flex: 1; }
      #mcp { font-family: var(--mono); font-size: 12px; }
      .key { font-family: var(--mono); font-size: 12px; }
      .state { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-2); }
      .ok { color: var(--success-text); font-weight: 600; }
      .device-icon { width: 40px; height: 40px; flex: none; border-radius: 10px; background: var(--fill); display: flex; align-items: center; justify-content: center; }
      progress { width: 140px; accent-color: var(--accent); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./settings/settings.tsx"></script>
  </body>
</html>
