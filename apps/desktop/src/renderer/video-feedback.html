<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
    <title>VibeScreener</title>
    <link rel="stylesheet" href="./theme.css" />
    <style>
      /* Rien ne défile ici : sans overscroll-behavior, la molette reçue quand la page prend la souris
         ferait rebondir toute la page, cadre tracé compris, au lieu de le laisser fixe sur l'écran. */
      html, body, #root { height: 100%; background: transparent; overflow: hidden; overscroll-behavior: none; user-select: none; pointer-events: none; }
      canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
      .feedback {
        position: fixed; bottom: calc(var(--dock, 0px) + 20px); left: 50%; transform: translateX(-50%);
        display: flex; flex-direction: column; gap: 8px; padding: 12px 16px; border-radius: 14px;
        background: rgba(28, 28, 30, 0.96); color: #f2f2f3;
        border: 1px solid rgba(255, 255, 255, 0.12); box-shadow: 0 8px 24px rgba(0, 0, 0, 0.28);
        font-size: 13px; white-space: nowrap; pointer-events: auto;
      }
      .feedback-head { display: flex; align-items: center; gap: 10px; }
      .feedback-head strong { font-weight: 600; }
      .feedback-head time { font-variant-numeric: tabular-nums; color: #c7c7cc; font-size: 12px; }
      .rec-dot { width: 8px; height: 8px; border-radius: 999px; background: #ff453a; }
      .feedback-meta { color: #c7c7cc; font-size: 12px; }
      .feedback-meta:empty { display: none; }
      .wave { flex: 1; min-width: 72px; height: 22px; display: flex; align-items: center; gap: 3px; }
      .wave span { width: 3px; border-radius: 2px; background: #f2f2f3; transition: height 0.1s; }
      .feedback kbd {
        display: inline-block; min-width: 20px; padding: 1px 6px; border-radius: 5px; text-align: center;
        font: inherit; font-size: 12px; background: rgba(255, 255, 255, 0.14); border: 1px solid rgba(255, 255, 255, 0.2);
      }
      .feedback button { display: flex; align-items: center; gap: 7px; height: 30px; padding: 0 10px; background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 7px; font-size: 12px; }
      .feedback button:hover { background: rgba(255, 255, 255, 0.18); }
      .feedback button:disabled { opacity: 0.4; }
      .feedback button.primary { background: var(--accent); border-color: var(--accent); }
      .feedback button.stop { margin-left: 6px; }
      .feedback button.stop kbd { min-width: 0; padding: 0 5px; font-size: 11px; color: #c7c7cc; background: none; }
      .feedback button.stop svg { color: #ff453a; }
      .feedback-tools { display: flex; align-items: center; gap: 8px; }
      .feedback-keys { display: flex; align-items: center; gap: 8px; color: #e5e5ea; }
      .feedback-keys .sep { color: #8e8e93; }
      .feedback.armed .point-key { background: var(--accent); border-color: var(--accent); }
      .feedback-hint { color: #aeaeb2; font-size: 11px; }
      .feedback-text {
        width: 380px; padding: 8px 10px; resize: none; border-radius: 8px; outline: none;
        font: inherit; color: inherit; background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.16);
        white-space: pre-wrap; user-select: text; cursor: text;
      }
      .feedback-text:hover { border-color: rgba(255, 255, 255, 0.3); }
      .feedback-text.writing { border-color: var(--accent); }
      .feedback-error { max-width: 380px; white-space: normal; color: #ffb4ab; font-size: 12px; }
      .feedback-head .spacer { flex: 1; min-width: 24px; }
      .feedback button.toggle { padding: 0 8px; color: #e5e5ea; }
      .feedback button.toggle[aria-pressed='true'] { background: var(--accent); border-color: var(--accent); color: #fff; }
      .feedback button.toggle .up { transform: rotate(180deg); }
      /* Pastille réduite : en-tête serré, icônes sans libellé ; le champ n'apparaît qu'avec un point. */
      .feedback.compact { gap: 6px; padding: 6px 8px 6px 12px; border-radius: 12px; }
      .feedback.compact .feedback-head { gap: 8px; }
      .feedback.compact .wave { flex: none; min-width: 0; gap: 2px; }
      .feedback.compact .wave span { width: 2px; }
      .feedback.compact .spacer { display: none; }
      .feedback.compact button { height: 26px; padding: 0 7px; }
      .feedback.compact button.stop { margin-left: 0; }
      .feedback.compact .label, .feedback.compact button.stop kbd { display: none; }
      .feedback.compact .feedback-text { width: 280px; padding: 6px 8px; }
      .feedback.compact .feedback-tools { gap: 6px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./video-feedback.tsx"></script>
  </body>
</html>
