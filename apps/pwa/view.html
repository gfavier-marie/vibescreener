<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" href="/icon-192.png" />
    <title>VibeScreener</title>
    <style>
      /* Visionneuse d'un projet partagé : lecture seule, sur ordinateur comme sur téléphone. */
      :root {
        --accent: #d63a0c; --text: #1d1d1f; --text-2: #3a3a3c; --muted: #6e6e73; --border: #e3e3e8; --soft: #f5f5f7; --error: #b3261e;
        font: 16px/1.45 -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; color: var(--text); -webkit-font-smoothing: antialiased;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; background: #fff; }
      button { font: inherit; color: inherit; cursor: pointer; }
      .top { display: flex; align-items: center; gap: 10px; max-width: 1080px; margin: 0 auto; padding: 18px 16px 0; color: var(--muted); font-size: 14px; }
      .top b { color: var(--text); font-weight: 650; }
      .top .tag { margin-left: auto; padding: 3px 10px; border-radius: 999px; background: var(--soft); font-size: 12.5px; }
      main { max-width: 1080px; margin: 0 auto; padding: 8px 16px 48px; }
      h1 { margin: 22px 0 6px; font-size: 30px; line-height: 1.15; letter-spacing: -0.02em; overflow-wrap: anywhere; }
      h2 { margin: 18px 0 4px; font-size: 22px; letter-spacing: -0.01em; overflow-wrap: anywhere; }
      h3 { margin: 0; font-size: 15px; overflow-wrap: anywhere; }
      .context { margin: 0 0 4px; color: var(--text-2); white-space: pre-wrap; overflow-wrap: anywhere; }
      .meta { margin: 0; color: var(--muted); font-size: 14px; }
      .status { margin: 40px 0; color: var(--muted); }
      .status.error { color: var(--error); }

      .reviews { list-style: none; margin: 24px 0; padding: 0; display: grid; gap: 10px; }
      .reviews button { width: 100%; display: flex; flex-direction: column; gap: 2px; padding: 14px 16px; border: 1px solid var(--border); border-radius: 12px; background: #fff; text-align: left; }
      .reviews button:hover { border-color: #c7c7cc; background: var(--soft); }
      .reviews .name { font-weight: 600; overflow-wrap: anywhere; }

      .back { margin-top: 18px; padding: 6px 12px 6px 8px; border: 0; border-radius: 8px; background: var(--soft); font-size: 14px; }
      .notes-title { margin-top: 22px; }
      .notes { margin: 8px 0 0; padding: 14px 16px 14px 34px; border-radius: 12px; background: var(--soft); }
      .notes li + li { margin-top: 4px; }

      .screen { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 18px; align-items: start; margin-top: 28px; padding-top: 22px; border-top: 1px solid var(--border); }
      .screen h3 { grid-column: 1 / -1; }
      .screen canvas { display: block; width: 100%; height: auto; border: 1px solid var(--border); border-radius: 8px; background: var(--soft); }
      .points { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
      .points li { display: grid; grid-template-columns: 30px 1fr; gap: 10px; }
      .pin {
        width: 26px; height: 26px; border-radius: 13px 13px 13px 3px; background: var(--accent); color: #fff; font-size: 12px; font-weight: 700;
        display: flex; align-items: center; justify-content: center;
      }
      .pin.round { border-radius: 13px; }
      .comment { margin: 2px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }
      .comment.empty { color: var(--muted); font-style: italic; }
      .author { color: var(--muted); font-size: 12.5px; font-weight: 600; }
      .points .author { display: block; margin-top: 2px; }
      .extras { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
      .extras figure { margin: 0; max-width: 150px; }
      .extras img { display: block; max-width: 150px; max-height: 110px; border: 1px solid var(--border); border-radius: 6px; background: #fff; }
      .extras figcaption { margin-top: 3px; color: var(--muted); font-size: 12px; line-height: 1.3; }

      footer { margin-top: 40px; padding-top: 18px; border-top: 1px solid var(--border); color: var(--muted); font-size: 14px; }
      footer p { margin: 0 0 10px; }
      footer button { padding: 7px 14px; border: 1px solid var(--border); border-radius: 8px; background: #fff; font-size: 14px; }

      @media (max-width: 760px) {
        h1 { font-size: 25px; }
        .screen { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <div class="top">
      <svg width="22" height="22" viewBox="0 0 28 28" aria-hidden="true"><path d="M14 2a12 12 0 1 1 0 24H2V14A12 12 0 0 1 14 2z" fill="#D63A0C"></path><circle cx="14" cy="14" r="4.2" fill="#fff"></circle></svg>
      <b>VibeScreener</b>
      <span class="tag" id="mode"></span>
    </div>
    <main id="main"></main>
    <script type="module" src="./src/view.ts"></script>
  </body>
</html>
